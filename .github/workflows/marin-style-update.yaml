name: Update marin-style

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marin-style-update
  cancel-in-progress: false

jobs:
  update:
    if: vars.MARIN_STYLE_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: external-runtime-updater
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: Iv23liNdDvC85E67xNa6
          private-key: ${{ secrets.DEPENDENCY_UPDATER_PRIVATE_KEY }}
          owner: marin-community
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: marin-community/marin-style/actions/update-consumer@727f180cd423246ca1a6164163a5883cda5bf52b
        with:
          token: ${{ steps.token.outputs.token }}
          app-slug: marin-external-runtime-updater
          base-branch: ${{ github.event.repository.default_branch }}
          mode: publish
